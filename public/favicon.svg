<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  fill="none"
>
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="56" y2="60">
      <stop offset="0" stop-color="#14213A"/>
      <stop offset="0.5" stop-color="#0A1426"/>
      <stop offset="1" stop-color="#050B15"/>
    </linearGradient>

    <linearGradient id="p" x1="17" y1="10" x2="48" y2="52">
      <stop offset="0" stop-color="#F4FCFF"/>
      <stop offset="0.22" stop-color="#7DE6FF"/>
      <stop offset="0.58" stop-color="#5B91FF"/>
      <stop offset="1" stop-color="#7B63F6"/>
    </linearGradient>

    <filter
      id="glow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%"
    >
      <feGaussianBlur
        stdDeviation="1.6"
        result="blur"
      />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="ambient">
      <stop offset="0" stop-color="#4C8DFF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#4C8DFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect
    width="64"
    height="64"
    rx="15"
    fill="url(#bg)"
  />

  <!-- Ambient glow -->
  <circle
    cx="31"
    cy="28"
    r="27"
    fill="url(#ambient)"
  />

  <!-- Premium border -->
  <rect
    x="1"
    y="1"
    width="62"
    height="62"
    rx="14"
    stroke="#75B7FF"
    stroke-opacity=".28"
  />

  <!-- PRIYAM — P -->
  <g filter="url(#glow)">
    <path
      d="
        M18 51
        V13
        H34.5
        C43.5 13
        48 17.2
        48 24.3
        C48 31.4
        43.5 35.6
        34.5 35.6
        H18
      "
      stroke="url(#p)"
      stroke-width="6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Subtle stem highlight -->
  <path
    d="M18 16V45"
    stroke="#FFFFFF"
    stroke-opacity=".32"
    stroke-width="1.1"
    stroke-linecap="round"
  />

  <!-- Minimal bottom reflection -->
  <path
    d="M21 56H42"
    stroke="#6B9CFF"
    stroke-opacity=".20"
    stroke-width=".8"
    stroke-linecap="round"
  />
</svg>